name: restore-creatures
on:
  push:
    paths:
      - 'tmp/restore-creatures/**'
      - '.github/workflows/restore-creatures.yml'
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/cursor/brotato-survivor-arena-18ce'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore creatures.ts from b64 parts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, sys
          parts = sorted(pathlib.Path('tmp/restore-creatures').glob('part-*.b64'))
          if len(parts) < 20:
              print('waiting for b64 parts', len(parts))
              sys.exit(0)
          data = b''.join(base64.b64decode(p.read_text().strip()) for p in parts)
          sha = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          assert sha == 'ca04288ac26b90db899a0270245aaa1df9d78326', sha
          assert len(data) == 73415, len(data)
          pathlib.Path('src/render/creatures.ts').write_bytes(data)
          print('restored', len(data), sha)
          PY
          bytes=$(wc -c < src/render/creatures.ts | tr -d ' ')
          if [ "$bytes" != "73415" ]; then
            echo "skip commit; size=$bytes"
            exit 0
          fi
          git config user.name 'cursor-agent'
          git config user.email 'cursor-agent@users.noreply.github.com'
          git add src/render/creatures.ts
          git rm -rf tmp/restore-creatures || true
          git rm -rf tmp/restore-gz || true
          git rm -f .github/workflows/restore-creatures.yml
          git commit -m 'Restore full creature painter (silhouettes, models, nightmare B construction).'
          git push

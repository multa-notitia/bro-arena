name: concat-creatures
on:
  push:
    paths:
      - '_concat/**'
permissions:
  contents: write
jobs:
  concat:
    if: github.ref == 'refs/heads/cursor/brotato-survivor-arena-18ce'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate creatures.ts when both parts exist
        run: |
          set -euo pipefail
          if [ ! -f _concat/creatures.a.txt ] || [ ! -f _concat/creatures.b.txt ]; then
            echo 'waiting for both parts'
            exit 0
          fi
          cat _concat/creatures.a.txt _concat/creatures.b.txt > src/render/creatures.ts
          python3 -c "from pathlib import Path; n=len(Path('src/render/creatures.ts').read_bytes()); assert n==73415, n"
          rm -rf _concat
          rm -f .github/workflows/concat-creatures.yml
          git config user.name 'cursor-agent'
          git config user.email 'cursor-agent@users.noreply.github.com'
          git add -A src/render/creatures.ts _concat .github/workflows/concat-creatures.yml
          git status
          git commit -m 'Match concept sheets: clean players, B-construction nightmares, A/B/C paint.'
          git push
